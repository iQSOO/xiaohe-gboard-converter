plugins {
    id 'com.android.application'
}
android {
    namespace 'com.iqsoo.wechatguard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.iqsoo.wechatguard'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
