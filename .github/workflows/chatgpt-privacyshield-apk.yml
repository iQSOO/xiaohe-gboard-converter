name: Build PrivacyShield APK temporary

on:
  push:
    branches: [chatgpt-privacyshield-apk-20260916]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-privacyshield/fix.{00..09} .chatgpt-privacyshield/src.{02..05} > /tmp/privacyshield.b64
          test "$(wc -c < /tmp/privacyshield.b64)" -eq 44772
          echo '573f64378948e603b536a251cb2a86ae14cdec6236a974843bcd8358518bd059  /tmp/privacyshield.b64' | sha256sum -c -
          base64 --decode /tmp/privacyshield.b64 > /tmp/PrivacyShieldShizuku-source-v0.2.0.zip
          echo '4b6e3eed3286c8728fc07f3a0df1692fa19ca5b5889d714d12a24d678260dc2c  /tmp/PrivacyShieldShizuku-source-v0.2.0.zip' | sha256sum -c -
          rm -rf /tmp/privacyshield-build
          mkdir -p /tmp/privacyshield-build
          unzip -q /tmp/PrivacyShieldShizuku-source-v0.2.0.zip -d /tmp/privacyshield-build
          test -f /tmp/privacyshield-build/PrivacyShieldShizuku/build.gradle.kts
          test -f /tmp/privacyshield-build/PrivacyShieldShizuku/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/privacyshield-build/PrivacyShieldShizuku
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/privacyshield-build/PrivacyShieldShizuku/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p /tmp/privacyshield-output
          cp "$APK" /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/privacyshield-output/APK-VERIFY.txt
          sha256sum /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk | tee /tmp/privacyshield-output/SHA256SUMS.txt
          unzip -t /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iQSOO-PrivacyShield-v0.2.0-APK
          path: /tmp/privacyshield-output/
          retention-days: 1
          if-no-files-found: error
