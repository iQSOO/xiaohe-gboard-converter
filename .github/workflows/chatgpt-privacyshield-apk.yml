name: Build AppOps Restore APK temporary

on:
  push:
    branches: [chatgpt-privacyshield-apk-20260916]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-privacyshield/fix.00 .chatgpt-privacyshield/fix.01 .chatgpt-privacyshield/fix.02 > /tmp/appopsrestore.b64
          test "$(wc -c < /tmp/appopsrestore.b64)" -eq 16988
          echo '30cf52b981edba818046a7d97764edcc3859d493aaa1729d407fa02291506b58  /tmp/appopsrestore.b64' | sha256sum -c -
          base64 --decode /tmp/appopsrestore.b64 > /tmp/AppOpsRestoreShizuku-source.zip
          echo 'df18d6cbc3f4f196e508f5b3a25ff84d07a7741cf6c91c744d0fa943bfd615e4  /tmp/AppOpsRestoreShizuku-source.zip' | sha256sum -c -
          rm -rf /tmp/appopsrestore-build
          mkdir -p /tmp/appopsrestore-build
          unzip -q /tmp/AppOpsRestoreShizuku-source.zip -d /tmp/appopsrestore-build
          test -f /tmp/appopsrestore-build/AppOpsRestoreShizuku/build.gradle.kts
          test -f /tmp/appopsrestore-build/AppOpsRestoreShizuku/app/build.gradle.kts
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' /tmp/appopsrestore-build/AppOpsRestoreShizuku/gradle.properties

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/appopsrestore-build/AppOpsRestoreShizuku
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/appopsrestore-build/AppOpsRestoreShizuku/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p /tmp/appopsrestore-output
          cp "$APK" /tmp/appopsrestore-output/iQSOO-AppOps-Restore-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/appopsrestore-output/APK-VERIFY.txt
          sha256sum /tmp/appopsrestore-output/iQSOO-AppOps-Restore-v1.0.0.apk | tee /tmp/appopsrestore-output/SHA256SUMS.txt
          unzip -t /tmp/appopsrestore-output/iQSOO-AppOps-Restore-v1.0.0.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iQSOO-AppOps-Restore-v1.0.0-APK
          path: /tmp/appopsrestore-output/
          retention-days: 1
          if-no-files-found: error
