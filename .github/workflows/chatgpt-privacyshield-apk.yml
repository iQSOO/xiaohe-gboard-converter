name: Build PrivacyShield APK temporary

on:
  push:
    branches:
      - chatgpt-privacyshield-apk-20260916

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          echo '816dbf1b79960d6ab275996a787b72176db35dd0090c7ef3b7a9c10b00408d46  .chatgpt-privacyshield/fix.00' | sha256sum -c -
          echo '76c62e9a85668dc9b24c1ed1683bbffb68f7529230070a45d313c8f15b3b2a51  .chatgpt-privacyshield/fix.01' | sha256sum -c -
          echo '9d86e5af1a38f9a284da729772a17e73e97a523c10e5982ac25caffd2e649b5b  .chatgpt-privacyshield/fix.02' | sha256sum -c -
          echo 'cde094092c00ec87330be286b9c0b0530e8e666ad0a1246e46eb31e59db9ac7d  .chatgpt-privacyshield/fix.03' | sha256sum -c -
          echo 'bd62f034f7433ba3a7c928234c3c4fb2aef7a0a97ffe3a7b3c865cf26a3435ea  .chatgpt-privacyshield/fix.04' | sha256sum -c -
          echo '0bd1581b37713874eeeda21f734de21d192b8fe533bfde232d916d7ff19cd2b1  .chatgpt-privacyshield/fix.05' | sha256sum -c -
          echo 'cab28b4a6ffd8a8aec1273b82849a3c09646702398b70c547d68f5b2ebd1d815  .chatgpt-privacyshield/fix.06' | sha256sum -c -
          echo '7c0d75a38decee58d186905a13b113147c1662caca8dba4bda799a3201245577  .chatgpt-privacyshield/fix.07' | sha256sum -c -
          echo '46fb2c0bf32e7157873c412ae49527a2a809fddee5a2eff2204b1c4c52c170cc  .chatgpt-privacyshield/fix.08' | sha256sum -c -
          echo 'e8b11231601cbbe80d2c742911177bc222bd01d8e16d09bc96f52d04c2ccdbbb  .chatgpt-privacyshield/fix.09' | sha256sum -c -
          echo '1aefa63685faf7ad47750b7683f00b159560d30a640a89cef8df433d318a9780  .chatgpt-privacyshield/src.02' | sha256sum -c -
          echo '757bb5ee1395cc5c1c58fdf53956414cccb3e224ea83cbbbbb1fad902382a6ce  .chatgpt-privacyshield/src.03' | sha256sum -c -
          echo '98014f4a6174cf14c00a41ad9bea5e4e4c2fde92de63ecd707e0f2fa57ab0231  .chatgpt-privacyshield/src.04' | sha256sum -c -
          echo '7df8539d0f6cd037f53e718e2caac20b4e3101b3b1871fcabc8ddd236b451d13  .chatgpt-privacyshield/src.05' | sha256sum -c -
          cat .chatgpt-privacyshield/fix.00 .chatgpt-privacyshield/fix.01 .chatgpt-privacyshield/fix.02 .chatgpt-privacyshield/fix.03 .chatgpt-privacyshield/fix.04 .chatgpt-privacyshield/fix.05 .chatgpt-privacyshield/fix.06 .chatgpt-privacyshield/fix.07 .chatgpt-privacyshield/fix.08 .chatgpt-privacyshield/fix.09 .chatgpt-privacyshield/src.02 .chatgpt-privacyshield/src.03 .chatgpt-privacyshield/src.04 .chatgpt-privacyshield/src.05 > /tmp/privacyshield.b64
          test "$(wc -c < /tmp/privacyshield.b64)" -eq 44772
          echo '573f64378948e603b536a251cb2a86ae14cdec6236a974843bcd8358518bd059  /tmp/privacyshield.b64' | sha256sum -c -
          base64 --decode /tmp/privacyshield.b64 > /tmp/PrivacyShieldShizuku-source-v0.2.0.zip
          echo '4b6e3eed3286c8728fc07f3a0df1692fa19ca5b5889d714d12a24d678260dc2c  /tmp/PrivacyShieldShizuku-source-v0.2.0.zip' | sha256sum -c -
          rm -rf /tmp/privacyshield-build
          mkdir -p /tmp/privacyshield-build
          unzip -q /tmp/PrivacyShieldShizuku-source-v0.2.0.zip -d /tmp/privacyshield-build
          test -f /tmp/privacyshield-build/build.gradle.kts
          test -f /tmp/privacyshield-build/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/privacyshield-build
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/privacyshield-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p /tmp/privacyshield-output
          cp "$APK" /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/privacyshield-output/APK-VERIFY.txt
          sha256sum /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk | tee /tmp/privacyshield-output/SHA256SUMS.txt
          unzip -t /tmp/privacyshield-output/iQSOO-PrivacyShield-v0.2.0-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iQSOO-PrivacyShield-v0.2.0-APK
          path: /tmp/privacyshield-output/
          retention-days: 1
          if-no-files-found: error
