name: Export Android SDK Tools
on:
  push:
    branches:
      - chatgpt-npatch-live-replace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare tool bundle
        shell: bash
        run: |
          mkdir sdk35
          cp "$ANDROID_HOME/platforms/android-35/android.jar" sdk35/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" sdk35/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" sdk35/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" sdk35/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sdk35/
          chmod +x sdk35/aapt2 sdk35/zipalign
          sha256sum sdk35/* > sdk35/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-sdk35-minimal
          path: sdk35
          if-no-files-found: error
          retention-days: 1
