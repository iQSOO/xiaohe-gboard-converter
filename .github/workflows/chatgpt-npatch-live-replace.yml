name: Export zipalign runtime
on:
  push:
    branches:
      - chatgpt-npatch-live-replace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
      - name: Collect runtime
        shell: bash
        run: |
          mkdir runtime
          find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so*' -type f -print -exec cp -L {} runtime/ \;
          test -f runtime/libc++.so
          sha256sum runtime/* > runtime/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-runtime
          path: runtime
          if-no-files-found: error
          retention-days: 1
