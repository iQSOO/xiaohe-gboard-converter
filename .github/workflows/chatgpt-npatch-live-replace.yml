name: Build NPatch Live Replace
on:
  push:
    branches:
      - chatgpt-npatch-live-replace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct project
        run: |
          mkdir -p /tmp/npatch-src
          cat .npatch-build/source.part*.b64 | base64 -d > /tmp/npatch-src/source.zip
          unzip -q /tmp/npatch-src/source.zip -d /tmp/npatch-src
          test -f /tmp/npatch-src/NPatchLiveReplace/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: /tmp/npatch-src/NPatchLiveReplace
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare artifact
        run: |
          cp /tmp/npatch-src/NPatchLiveReplace/app/build/outputs/apk/release/app-release.apk NPatch-Live-Replace-v1.0.0.apk
          sha256sum NPatch-Live-Replace-v1.0.0.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NPatch-Live-Replace-v1.0.0
          path: |
            NPatch-Live-Replace-v1.0.0.apk
            SHA256.txt
          if-no-files-found: error
          retention-days: 1
